name: Build GKI KernelSU SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex git-core gnupg build-essential ccache curl libffi-dev libssl-dev libxml2-utils xsltproc zlib1g-dev python3 zip unzip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync Android Common Kernel Source
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all)

      - name: Setup KernelSU & SuSFS
        run: |
          cd android-kernel/common
          
          # 1. Tích hợp KernelSU Official
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # 2. Clone SuSFS từ mirror GitHub chính thức của cộng đồng KernelSU
          git clone --depth=1 https://github.com/vboot-patch/susfs4ksu.git -b gki-android12-5.10 susfs || \
          git clone --depth=1 https://github.com/Wilder-G/susfs4ksu.git -b gki-android12-5.10 susfs
          
          # 3. Apply Patch SuSFS vào KernelSU & Kernel Core
          cp susfs/kernel_patches/KernelSU/1001-App-Profile-Fix-for-SuSFS.patch KernelSU/ || true
          cp susfs/kernel_patches/fs/* fs/ || true
          cp susfs/kernel_patches/include/linux/* include/linux/ || true
          
          patch -p1 < susfs/kernel_patches/5.10/0001-kernel-5.10-susfs-v1.5.5.patch || true
          
          # 4. Thêm Cấu hình Config SuSFS vào defconfig
          cat >> arch/arm64/configs/gki_defconfig <<EOF
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF

      - name: Build Kernel Image
        run: |
          cd android-kernel
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Package Output
        run: |
          mkdir -p output
          cp android-kernel/out/android12-5.10/dist/Image output/Image
          cd output
          zip -r gki-ksu-susfs-5.10.zip Image

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-KernelSU-SuSFS-Image
          path: output/gki-ksu-susfs-5.10.zip
