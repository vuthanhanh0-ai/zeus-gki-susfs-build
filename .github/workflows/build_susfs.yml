name: Build GKI KernelSU-Next SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex git-core gnupg build-essential ccache curl libffi-dev libssl-dev libxml2-utils xsltproc zlib1g-dev python3 zip unzip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync Android Common Kernel Source
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all)
          
      - name: Setup SukiSU (KernelSU-Next) & SuSFS
        run: |
          cd android-kernel/common
          
          # 1. Clone SukiSU (KernelSU-Next) từ repo public uy tín
          git clone -b next https://github.com/rifs33/KernelSU-Next.git KernelSU-Next
          
          # Link SukiSU vào cây kernel
          ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          echo "obj-y += kernelsu/" >> drivers/Makefile
          
          # 2. Clone SuSFS Patches
          git clone https://gitlab.com/simonfong8/susfs4ksu.git -b gki-android12-5.10 susfs
          
          # 3. Apply Patch SuSFS
          # Copy các file cần thiết
          cp susfs/kernel_patches/KernelSU/1001-App-Profile-Fix-for-SuSFS.patch KernelSU-Next/ || true
          cp susfs/kernel_patches/fs/* fs/ || true
          cp susfs/kernel_patches/include/linux/* include/linux/ || true
          
          # Patch chính
          patch -p1 < susfs/kernel_patches/5.10/0001-kernel-5.10-susfs-v1.5.5.patch || true
          
          # 4. Cấu hình CONFIG SuSFS
          # Sử dụng lệnh sed để thêm vào config thay vì append để tránh trùng lặp
          cat >> arch/arm64/configs/gki_defconfig <<EOF
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF

      - name: Build Kernel Image
        run: |
          cd android-kernel
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Package Output
        run: |
          mkdir -p output
          cp android-kernel/out/android12-5.10/dist/Image output/Image
          cd output
          zip -r gki-ksu-susfs-5.10.zip Image

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GKI-KernelSU-Next-SuSFS-Image
          path: output/gki-ksu-susfs-5.10.zip
