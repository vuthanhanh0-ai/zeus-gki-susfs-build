name: Build GKI SukiSU SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex git-core gnupg build-essential ccache curl libffi-dev libssl-dev libxml2-utils xsltproc zlib1g-dev python3 zip unzip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync GKI Source
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all)

      - name: Setup SukiSU & SuSFS
        run: |
          cd android-kernel/common
          
          # Tải SukiSU (KernelSU-Next) setup script
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          
          # Clone SuSFS
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs || true
          
          if [ -d "susfs" ]; then
            cp susfs/kernel_patches/KernelSU/1001-App-Profile-Fix-for-SuSFS.patch KernelSU/ || true
            cp susfs/kernel_patches/fs/* fs/ || true
            cp susfs/kernel_patches/include/linux/* include/linux/ || true
            patch -p1 < susfs/kernel_patches/5.10/0001-kernel-5.10-susfs-v1.5.5.patch || true
          fi
          
          cat >> arch/arm64/configs/gki_defconfig <<EOF
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          EOF

      - name: Build Kernel
        run: |
          cd android-kernel
          LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-SuSFS-Image
          path: android-kernel/out/android12-5.10/dist/Image
