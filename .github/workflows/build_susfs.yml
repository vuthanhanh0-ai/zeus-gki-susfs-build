name: Build GKI SukiSU SuSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache
          sudo apt-get clean

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex git-core gnupg build-essential ccache curl libffi-dev libssl-dev libxml2-utils xsltproc zlib1g-dev python3 zip unzip

      - name: Install Repo Tool
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+rx ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Sync GKI Source
        run: |
          mkdir android-kernel && cd android-kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10 --depth=1
          repo sync -c -j$(nproc --all)

      - name: Setup SukiSU & SuSFS
        run: |
          cd android-kernel/common
          
          # 1. Tải SukiSU-Ultra (KernelSU-Next) từ repo chuẩn của tác giả rifsxd
          git clone -b next https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu || \
          git clone -b main https://github.com/rifsxd/KernelSU-Next.git drivers/kernelsu
          
          # Tích hợp drivers/kernelsu vào hệ thống Makefile & Kconfig của Kernel
          grep -q "obj-y += kernelsu/" drivers/Makefile || echo "obj-y += kernelsu/" >> drivers/Makefile
          grep -q "source \"drivers/kernelsu/Kconfig\"" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          
          # 2. Tải SuSFS Patches chính thức
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android12-5.10 susfs || true
          
          # 3. Apply Patch SuSFS vào Kernel Core & SukiSU
          if [ -d "susfs" ]; then
            cp susfs/kernel_patches/fs/* fs/ || true
            cp susfs/kernel_patches/include/linux/* include/linux/ || true
            cp susfs/kernel_patches/KernelSU/1001-App-Profile-Fix-for-SuSFS.patch drivers/kernelsu/ || true
            
            patch -p1 < susfs/kernel_patches/5.10/0001-kernel-5.10-susfs-v1.5.5.patch || true
            
            cd drivers/kernelsu
            patch -p1 < 1001-App-Profile-Fix-for-SuSFS.patch || true
            cd ../..
          fi
          
          # 4. Kích hoạt Cấu hình Config SuSFS
          cat >> arch/arm64/configs/gki_defconfig <<EOF
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SUS_OVERLAYFS=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          EOF

      - name: Build Kernel
        run: |
          cd android-kernel
          sed -i 's/check_defconfig//g' build/build.sh || true
          sed -i 's/check_defconfig//g' common/build.config.gki || true
          
          LTO=thin SKIP_DEFCONFIG_CHECK=1 BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh

      - name: Package AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git --depth=1 AnyKernel3
          cp android-kernel/out/android12-5.10/dist/Image AnyKernel3/Image
          
          cd AnyKernel3
          sed -i 's/device.name1=/device.name1=zeus/g' anykernel.sh
          sed -i 's/BLOCK=/BLOCK=\/dev\/block\/by-name\/boot;/g' anykernel.sh
          sed -i 's/IS_SLOT_DEVICE=0/IS_SLOT_DEVICE=auto/g' anykernel.sh
          
          zip -r9 ../SukiSU-SuSFS-Zeus-AnyKernel3.zip * -x .git\* README.md *placeholder

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-SuSFS-Zeus-AnyKernel3
          path: SukiSU-SuSFS-Zeus-AnyKernel3.zip
